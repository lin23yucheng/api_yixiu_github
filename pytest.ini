[pytest]
# 忽略 urllib3 的 HTTPS 未校验证书警告（例如请求里使用 verify=False）。
# 这样在测试环境（如内网/自签证书）下运行 pytest 时，控制台输出更干净。
filterwarnings =
    ignore:Unverified HTTPS request:urllib3.exceptions.InsecureRequestWarning


markers =
    module: 业务模块标签，用于影响面分析筛选用例
    bash_system: Bash系统验证
    dmp_token: DMP机台Token
    annotation_2d: 2D标注
    annotation_3d: 3D标注
    training_deep: 深度模型训练
    training_class: 分类模型训练
    training_eiir: EIIR模型训练
    training_data: 数据训练任务
    training_metrics: 模型训练指标
    model_base: 模型库
    product_info: 产品资料
    product_samples: 产品样例
    push_map: 机台推图
    controller: 训练前置数据校验
    simulation: 仿真
    smoke: 冒烟测试用例（主流程，快速验证）
