[ai_model]
; AI 分析模块配置
; LLM 提供商（支持 github / deepseek）
llm_provider = deepseek

; Token 配置项名（推荐在 secret.env 中配置真实值）
github_token = GITHUB_TOKEN
deepseek_apikeys = APIKEYS_DS

; 使用的模型名称
github_model = gpt-4o
deepseek_model = deepseek-v4-pro

; API 地址
github_models_api_url = https://models.inference.ai.azure.com/chat/completions
deepseek_models_api_url = https://api.deepseek.com/chat/completions

; API 请求超时时间（秒）
; ai_analyzer_timeout = 120

; 本地密钥文件（建议使用，文件应加入 .gitignore）
secret_env_file = config/secret.env

