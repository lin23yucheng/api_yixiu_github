[semantic_assertion]
; 是否启用语义断言引擎
enabled = true

; 严格模式：当风险=HIGH时直接让用例失败
strict = false

; baseline 文件路径（可用环境变量 SEMANTIC_ASSERT_BASELINE_FILE 覆盖）
baseline_file = config/semantic_baseline.json

[llm_second_review]
; 是否启用高风险项 LLM 二次复核（使用 ai_config.ini 中的当前 LLM 配置）
enabled = true

; 单次复核最多发送的高风险样本数
max_cases = 8

